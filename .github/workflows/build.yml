name: build

on:
  schedule:
    - cron: "7 * * * *"      # hourly; each run publishes whatever games went final since the last one
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "templates/**", "netlify.toml", ".github/workflows/build.yml"]

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update data and render site
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name "wortha-watch bot"
          git config user.email "bot@wortha.watch"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27 deploy --prod --dir=site --message "build $(date -u +'%Y-%m-%d %H:%M UTC')"
